-- LISTAS Y MENSAJES ---------------------------------------------------
CREATE TABLE IF NOT EXISTS listas (
  id TEXT PRIMARY KEY, tipo TEXT NOT NULL DEFAULT 'adulto',
  nombre TEXT NOT NULL, edad INTEGER,
  deseos JSONB DEFAULT '[]'::jsonb,
  created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());

CREATE TABLE IF NOT EXISTS mensajes_anonimos (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  mensaje TEXT NOT NULL,
  fecha TIMESTAMPTZ DEFAULT NOW());

ALTER TABLE listas ENABLE ROW LEVEL SECURITY;
ALTER TABLE mensajes_anonimos ENABLE ROW LEVEL SECURITY;

CREATE POLICY "public_listas"   ON listas            FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "public_mensajes" ON mensajes_anonimos FOR ALL USING (true) WITH CHECK (true);

-- TIENDAS (storage + metadatos) ---------------------------------------

<style>
:root{
  --rojo:#c0392b;--rojo-claro:#e74c3c;--verde:#2e9e3f;--verde-oscuro:#1a5c2a;--verde-hover:#267f34;
  --dorado:#d4af37;--dorado-claro:#f1c40f;
  --sombra:rgba(0,0,0,.12);--sombra-fuerte:rgba(0,0,0,.22);
  --fondo:#eef5fb;--texto:#1f2937;--texto-suave:#5b6472;
  --tarjeta-bg:#ffffff;--borde:#e5eaf0;--input-bg:#fff;--input-border:#cbd5e1;--modal-bg:#fff;
  --acento-suave:#fdf6e3;
}
[data-theme="dark"]{
  --fondo:#0f1729;--texto:#e8eef5;--texto-suave:#a3aec2;
  --tarjeta-bg:#1a2438;--borde:#2c3a54;--sombra:rgba(0,0,0,.35);--sombra-fuerte:rgba(0,0,0,.6);
  --rojo:#ef5350;--rojo-claro:#ff6b6b;--verde:#3dbb54;--verde-hover:#34a047;
  --dorado:#e6c154;--input-bg:#0f1729;--input-border:#334155;--modal-bg:#0f1729;
  --acento-suave:#1f2c44;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background-color:var(--fondo);color:var(--texto);line-height:1.6;
  padding:22px 20px 20px;min-height:100vh;
  transition:background-color .3s,color .3s;position:relative;overflow-x:hidden;
}
body.modal-abierto{overflow:hidden}
body.paused *{animation-play-state:paused!important}
body>header,body>section,body>footer,body>div.cinta-mensajes{position:relative;z-index:1}

#lucesFondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;contain:strict}
[data-theme="dark"] #lucesFondo{display:block}
.luz{position:absolute;border-radius:50%;pointer-events:none;opacity:.18;transform:translate(-50%,-50%);animation:pulsoLuz 22s ease-in-out infinite;filter:blur(40px)}
@keyframes pulsoLuz{0%,100%{opacity:.14}50%{opacity:.26}}

@media(prefers-reduced-motion:reduce){
  .luz{animation:none!important;opacity:.18!important}
  .copo{display:none!important}
  .cinta-track{animation:none!important;white-space:normal!important;flex-wrap:wrap!important}
  .cal-santa{animation:none!important}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.barra-superior{position:fixed;top:18px;right:18px;display:flex;gap:10px;z-index:600}
.btn-icono{
  width:46px;height:46px;border-radius:50%;border:2px solid var(--dorado);
  background:var(--tarjeta-bg);color:var(--texto);font-size:1.25rem;cursor:pointer;
  box-shadow:0 4px 14px var(--sombra-fuerte);transition:transform .2s, background .2s, box-shadow .2s;
  display:flex;align-items:center;justify-content:center;
}
.btn-icono:hover{transform:scale(1.08);background:var(--acento-suave)}
.btn-icono:focus-visible{outline:3px solid var(--dorado-claro);outline-offset:2px}
.btn-icono.inactivo{opacity:.45}
.btn-icono.encendido{border-color:var(--dorado-claro);box-shadow:0 4px 14px var(--sombra-fuerte), 0 0 16px rgba(241,196,15,.7)}

#nieve{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500;overflow:hidden}
#nieve.oculto{display:none}
.copo{position:absolute;top:-30px;color:#fff;animation:caer linear infinite;user-select:none;text-shadow:0 0 4px rgba(255,255,255,.7);will-change:transform}
@keyframes caer{to{transform:translateY(110vh)}}

.cabecera-principal{
  position:relative;width:100%;border-radius:20px;overflow:hidden;
  margin-bottom:16px;box-shadow:0 12px 34px var(--sombra-fuerte);
  border:1px solid rgba(241,196,15,.25);
  background:linear-gradient(135deg,#0e3a1c 0%,#1a5c2a 55%,#c0392b 140%);
  min-height:150px;
}
.cabecera-logo-img{display:block;width:100%;height:auto;border-radius:20px}
.cuenta-regresiva-overlay{
  position:absolute;left:14px;bottom:14px;
  max-height:calc(42% - 14px);max-width:min(440px, 55%);
  overflow:hidden;background:rgba(14,58,28,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1.5px solid rgba(241,196,15,.55);border-radius:14px;
  padding:10px 12px;color:#fff;
  display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 8px 26px rgba(0,0,0,.55);z-index:2;
}
.cuenta-regresiva-overlay h2{font-size:clamp(.6rem, 1.4vw, .95rem);color:var(--dorado-claro);margin-bottom:7px;line-height:1.15;text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.cuenta-regresiva-overlay #contador{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:5px;font-weight:800;line-height:1}
.cuenta-regresiva-overlay #contador span{background:rgba(0,0,0,.45);padding:6px 7px;border-radius:8px;text-align:center;font-size:clamp(.72rem, 2.4vw, 1.5rem);font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(241,196,15,.28)}
.cuenta-regresiva-overlay #contador small{display:block;font-size:clamp(.4rem, .95vw, .65rem);font-weight:600;color:var(--dorado-claro);margin-top:2px;letter-spacing:.4px;text-transform:uppercase}

.btn-crear{background:linear-gradient(135deg,var(--rojo),var(--rojo-claro));color:#fff;border:none;padding:12px 24px;font-size:.95rem;border-radius:30px;cursor:pointer;box-shadow:0 6px 16px rgba(192,57,43,.3);transition:transform .2s, box-shadow .2s;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-crear:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(192,57,43,.4)}
.btn-crear:focus-visible{outline:3px solid var(--dorado-claro);outline-offset:2px}
.btn-crear-header{position:absolute;right:14px;bottom:14px;z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 2px rgba(241,196,15,.55),0 0 18px rgba(241,196,15,.35)}

.cinta-mensajes{position:relative;background:linear-gradient(90deg,var(--rojo),var(--verde),var(--rojo));border-radius:14px;overflow:hidden;padding:12px 0;margin:0 0 20px;box-shadow:0 8px 20px rgba(192,57,43,.25)}
.cinta-mensajes::before,.cinta-mensajes::after{content:'';position:absolute;top:0;bottom:0;width:50px;pointer-events:none;z-index:2}
.cinta-mensajes::before{left:0;background:linear-gradient(90deg,var(--rojo),transparent)}
.cinta-mensajes::after{right:0;background:linear-gradient(270deg,var(--rojo),transparent)}
.cinta-track{display:inline-flex;white-space:nowrap;color:#fff;font-weight:600;font-size:.92rem;will-change:transform;animation:cintaScroll var(--cinta-duracion,60s) linear infinite}
.cinta-track:hover{animation-play-state:paused}
@keyframes cintaScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cinta-msg{padding:0 6px;text-shadow:0 1px 3px rgba(0,0,0,.4);font-size:.95rem}
.cinta-fecha{background:rgba(0,0,0,.35);padding:2px 10px;border-radius:12px;font-size:.72rem;margin-right:8px;color:var(--dorado-claro);letter-spacing:.3px;font-weight:700}
.cinta-sep{padding:0 16px;font-size:1rem;opacity:.9}
.cinta-vacio{padding:0 30px;font-style:italic;opacity:.95}

.barra-info-linea{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 14px;align-items:start;}
.calendario-box{grid-column:1;grid-row:1;align-self:start;}
.col-derecha{grid-column:2;grid-row:1;aspect-ratio:16/11;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;overflow:hidden;}
.col-derecha .anonimo-box,.col-derecha .galeria-tiendas{flex:1 1 0;min-height:0;min-width:0;overflow:auto;}
.col-derecha .anonimo-box{overflow-y:auto;overflow-x:hidden;align-self:stretch;}
@media(max-width:900px){
  .barra-info-linea{grid-template-columns:1fr;align-items:start}
  .calendario-box{grid-column:1;grid-row:auto;align-self:start}
  .col-derecha{grid-column:1;grid-row:auto;aspect-ratio:auto;overflow:visible;height:auto}
  .col-derecha .anonimo-box,.col-derecha .galeria-tiendas{flex:0 0 auto;min-height:auto;overflow:visible;align-self:auto}
}

.calendario-box{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 28px var(--sombra-fuerte);border:2px solid var(--dorado);background:#0e3a1c;display:flex;aspect-ratio:16/11;align-self:start}
.calendario-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;transition:background-image .5s}
.calendario-contenido{position:relative;z-index:2;padding:10px;width:100%;display:flex;flex-direction:column}
.calendario-titulo{color:#fff;text-align:center;font-size:clamp(.75rem, 1.4vw, 1rem);margin:0 auto 6px;text-transform:uppercase;letter-spacing:1px;font-weight:800;padding:4px 16px;border-radius:18px;background:rgba(14,58,28,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(241,196,15,.35);box-shadow:0 3px 12px rgba(0,0,0,.4);text-shadow:0 2px 6px rgba(0,0,0,.85);display:inline-block;align-self:center}
.calendario-grid{display:grid;grid-template-columns:repeat(7, minmax(0, 1fr));grid-auto-rows:minmax(26px, 1fr);gap:3px;flex-grow:1}
.cal-dia-semana{text-align:center;font-size:clamp(.55rem, .9vw, .68rem);font-weight:800;color:var(--dorado-claro);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;padding:1px 0;text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6)}
.cal-celda{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border-radius:6px;font-size:clamp(.65rem, 1vw, .82rem);font-weight:700;color:#fff;min-width:0;border:1px solid rgba(255,255,255,.1);line-height:1;transition:transform .15s;text-shadow:0 1px 2px rgba(0,0,0,.5);padding:1px}
.cal-celda.cal-vacia{background:transparent;border-color:transparent}
.cal-num{font-size:clamp(.7rem, 1.1vw, .85rem);line-height:1}
.cal-icono{font-size:clamp(.5rem, .9vw, .68rem);margin-top:1px;line-height:1}
.cal-hoy{outline:2px solid var(--dorado-claro);outline-offset:-2px;box-shadow:0 0 16px rgba(241,196,15,.75), inset 0 0 10px rgba(241,196,15,.25)}
.cal-santa{position:absolute;top:-6px;right:-6px;font-size:clamp(.7rem, 1.2vw, .95rem);filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));animation:santaBounce 2s ease-in-out infinite;z-index:3;pointer-events:none;line-height:1}
@keyframes santaBounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.cal-adviento-inicio{background:linear-gradient(135deg, rgba(46,158,63,.78), rgba(61,187,84,.55));border-color:rgba(61,187,84,.9);box-shadow:0 0 8px rgba(61,187,84,.4)}
.cal-adviento{background:linear-gradient(135deg, rgba(212,175,55,.55), rgba(241,196,15,.4));border-color:rgba(241,196,15,.85)}
.cal-nochebuena{background:linear-gradient(135deg, rgba(231,76,60,.72), rgba(255,107,107,.45));border-color:rgba(255,107,107,.9)}
.cal-navidad{background:linear-gradient(135deg, rgba(192,57,43,.9), rgba(231,76,60,.7));border-color:var(--dorado-claro);box-shadow:0 0 14px rgba(241,196,15,.6);font-weight:900}
.calendario-leyenda{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18)}
.leyenda-item{font-size:clamp(.5rem, .8vw, .65rem);font-weight:700;color:#fff;padding:2px 7px;border-radius:8px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:.2px}
.leyenda-adviento-inicio{background:rgba(61,187,84,.5);border:1px solid rgba(61,187,84,.75)}
.leyenda-adviento{background:rgba(212,175,55,.42);border:1px solid rgba(241,196,15,.7)}
.leyenda-nochebuena{background:rgba(231,76,60,.55);border:1px solid rgba(255,107,107,.8)}
.leyenda-navidad{background:rgba(192,57,43,.65);border:1px solid rgba(241,196,15,.85)}

/* TIENDA 2.5D */
.tienda-box{
  position:relative;
  background:linear-gradient(160deg,var(--tarjeta-bg) 0%,var(--acento-suave) 100%);
  border:2px solid var(--dorado);border-radius:18px;padding:12px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 10px 28px var(--sombra);min-width:0;
  margin:24px 0;
}
.tienda-titulo{color:var(--rojo);text-align:center;font-size:clamp(.9rem,1.4vw,1.1rem);font-weight:800;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase}

.tienda-temas{
  display:flex;gap:5px;flex-wrap:wrap;justify-content:center;
  margin-bottom:10px;padding:4px;width:100%;
  background:var(--fondo);border-radius:12px;border:1px solid var(--borde);
}
.tema-btn{
  border:2px solid var(--borde);background:var(--tarjeta-bg);color:var(--texto);
  padding:6px 12px;border-radius:16px;cursor:pointer;
  font-size:.78rem;font-weight:700;transition:all .15s;white-space:nowrap;
}
.tema-btn:hover{border-color:var(--dorado)}
.tema-btn.activo{
  background:linear-gradient(135deg,var(--rojo),var(--rojo-claro));
  color:#fff;border-color:var(--rojo);
  box-shadow:0 3px 10px rgba(192,57,43,.4);
}

.tienda-captura{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:6px 0;
  overflow:hidden;
}

/* ESCENARIO — SIEMPRE 1:1 para que la captura salga 1:1 */
.tienda-escenario{
  position:relative;
  width:96%;
  max-width:100%;
  aspect-ratio: 1 / 1;
  background:#fdf6e3;
  overflow:hidden;
  display:block;
  border-radius:8px;
  box-shadow:0 6px 18px var(--sombra-fuerte);
  touch-action: pan-y;
}

@media(min-width:600px){
  .tienda-escenario{
    width:94%;
    aspect-ratio: 1 / 1;
  }
}

@media(min-width:1024px){
  .tienda-escenario{
    width:90%;
    max-width:1000px;
    aspect-ratio: 1 / 1;
  }
}

.tienda-pared{
  position:absolute;top:0;left:0;right:0;height:55%;
  background-color:#f5e6c8;
  background-image:
    repeating-linear-gradient(0deg,transparent 0,transparent 20px,rgba(139,111,71,.18) 20px,rgba(139,111,71,.18) 22px),
    repeating-linear-gradient(90deg,transparent 0,transparent 20px,rgba(139,111,71,.18) 20px,rgba(139,111,71,.18) 22px),
    radial-gradient(ellipse at center 30%, rgba(255,245,220,.55), transparent 70%),
    linear-gradient(180deg, rgba(180,140,90,.08) 0%, rgba(90,58,26,.22) 100%);
  border-bottom:3px solid #5a3a1a;
  box-shadow: inset 0 -6px 12px rgba(0,0,0,.3);
}

.tienda-suelo{
  position:absolute;top:55%;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 100% 100% at 50% 0%, rgba(0,0,0,.32) 0%, transparent 45%),
    linear-gradient(180deg, #c99868 0%, #d4a574 50%, #b8935f 100%);
  overflow:hidden;
}

.tienda-suelo-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tienda-suelo-svg .piso-long line{stroke:rgba(90,58,26,.42);stroke-width:.35;fill:none}
.tienda-suelo-svg .piso-trans line{stroke:rgba(90,58,26,.28);stroke-width:.28}

.tienda-alfombra{
  position:absolute;
  left:18%;
  right:18%;
  bottom:5%;
  height:18%;
  z-index:2;
  pointer-events:none;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)) drop-shadow(0 8px 14px rgba(0,0,0,.35));
}
.tienda-alfombra svg{display:block;width:100%;height:100%}
.alfombra-cuerpo{fill:#c0392b;stroke:#8b1a0f;stroke-width:1.5}
.alfombra-borde-punteado{fill:none;stroke:#f1c40f;stroke-width:0.8;stroke-dasharray:1.5 1.5}
.alfombra-borde-exterior{fill:none;stroke:#d4af37;stroke-width:1.2}
.alfombra-rombo{fill:#f1c40f}

.tienda-copos{
  position:absolute;top:0;left:0;right:0;height:55%;
  pointer-events:none;z-index:1;
  background-image:
    radial-gradient(circle at 6% 30%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 15% 55%, rgba(255,255,255,.6) 1.5px, transparent 2.5px),
    radial-gradient(circle at 24% 25%, rgba(255,255,255,.75) 1px, transparent 2px),
    radial-gradient(circle at 78% 40%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 88% 60%, rgba(255,255,255,.6) 1.5px, transparent 2.5px),
    radial-gradient(circle at 95% 30%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.55) 1.5px, transparent 2.5px),
    radial-gradient(circle at 84% 12%, rgba(255,255,255,.55) 1.5px, transparent 2.5px);
}

.tienda-luces-techo{position:absolute;top:0;left:0;right:0;height:34%;pointer-events:none;z-index:3;overflow:visible}
.tienda-guirnalda{position:absolute;top:6%;left:0;right:0;height:8%;pointer-events:none;z-index:3;overflow:visible}
.tienda-guirnalda.dos{top:16%;height:7%;opacity:.92}

.tienda-ambiente{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    radial-gradient(ellipse 90% 45% at 50% 0%, rgba(255,210,120,.16) 0%, transparent 70%),
    radial-gradient(ellipse 60% 35% at 50% 100%, rgba(255,150,60,.1) 0%, transparent 70%);
}

.tienda-rotulo{
  position:absolute;top:1.5%;left:50%;transform:translateX(-50%);
  width:88%;height:6.5%;min-height:22px;
  background:linear-gradient(180deg, #d4b58a 0%, #b8956a 35%, #8b6f47 70%, #5a3a1a 100%);
  border:2.5px solid #8b1a0f;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 4px 0 #3a2410,
    0 8px 16px rgba(0,0,0,.42),
    inset 0 3px 0 rgba(255,255,255,.42),
    inset 0 -2px 4px rgba(0,0,0,.35),
    0 0 0 1.5px #f1c40f,
    0 0 24px rgba(241,196,15,.38);
  z-index:10;padding:0 22px;cursor:pointer;user-select:none;
  transition:transform .15s, box-shadow .15s;
}
.tienda-rotulo:hover{
  transform:translateX(-50%) translateY(-1px);
  box-shadow:
    0 6px 0 #3a2410,0 10px 20px rgba(0,0,0,.48),
    inset 0 3px 0 rgba(255,255,255,.42),
    inset 0 -2px 4px rgba(0,0,0,.35),
    0 0 0 1.5px #f1c40f,0 0 30px rgba(241,196,15,.55);
